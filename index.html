<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぴょこ村けいさんぐらし</title>
<meta name="description" content="村を歩いて住人のクエストを計算で解き、どんぐりや家具、コラムを集めて部屋をかざるゲーム">
<meta name="theme-color" content="#B4824E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#7E5D3C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぴょこ村">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a handheld game screen in one column — wooden HUD on top, the village board, a controller, and five tabs at the bottom. Panels read like painted signboards; the one loud color is construction-site safety yellow. */
:root{
  --bg:#E4F0D6; --ink:#3B2F24; --sub:#7B6B58; --line:#D8C9AF;
  --paper:#FFFDF5; --wood:#B4824E; --wood-d:#8A5E34; --wood-ink:#FFF6E6;
  --accent:#F2B705; --accent-ink:#3B2F24; --accent-soft:#FCEFC0;
  --leaf:#4A9547; --leaf-soft:#DBEED3; --berry:#D2504B; --berry-soft:#F9E1DF; --sky:#4F9DC4; --sky-soft:#DCEEF6;
  --g1:#9ED07C; --g2:#95C873; --path:#E9D3A3; --path-e:#D8BD86; --water:#7EC6E5; --water-d:#5FB0D6; --sand:#F5E5B8;
  --shade:rgba(59,47,36,.16);
  --display:"Kiwi Maru","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C2826; --ink:#F2EADB; --sub:#B6A992; --line:#463F34;
  --paper:#28292A; --wood:#7E5D3C; --wood-d:#5E432A; --wood-ink:#FFF2DC;
  --accent:#F3C53A; --accent-ink:#2A220F; --accent-soft:#4A3F1C;
  --leaf:#7DC77B; --leaf-soft:#283F2C; --berry:#F08884; --berry-soft:#47292A; --sky:#80C3E3; --sky-soft:#213E4B;
  --g1:#4E7B46; --g2:#487340; --path:#9A8660; --path-e:#7F6D4B; --water:#2D5D7E; --water-d:#244E6A; --sand:#A5966F;
  --shade:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C2826; --ink:#F2EADB; --sub:#B6A992; --line:#463F34;
  --paper:#28292A; --wood:#7E5D3C; --wood-d:#5E432A; --wood-ink:#FFF2DC;
  --accent:#F3C53A; --accent-ink:#2A220F; --accent-soft:#4A3F1C;
  --leaf:#7DC77B; --leaf-soft:#283F2C; --berry:#F08884; --berry-soft:#47292A; --sky:#80C3E3; --sky-soft:#213E4B;
  --g1:#4E7B46; --g2:#487340; --path:#9A8660; --path-e:#7F6D4B; --water:#2D5D7E; --water-d:#244E6A; --sand:#A5966F;
  --shade:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wood)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;background:var(--wood);color:var(--wood-ink);box-shadow:0 3px 0 var(--wood-d)}
.hud .me{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hud .me b{font-family:var(--display);font-weight:500;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--wood-ink);display:grid;place-items:center;overflow:hidden}
.hud .av svg{width:32px;height:32px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--wood-d);border-radius:999px;padding:3px 12px 3px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.iconbtn{border:none;background:var(--wood-d);color:var(--wood-ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.view{display:flex;flex-direction:column;gap:12px}
#v-mura{gap:10px}
h2{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0}
p{margin:0}
.muted{color:var(--sub);font-size:.85rem}
/* map */
.mapwrap{width:100%;display:flex;justify-content:center}
#map{--t:34px;position:relative;width:calc(var(--t) * 10);height:calc(var(--t) * 13);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 var(--wood-d),0 0 0 4px var(--wood);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,var(--t));grid-template-rows:repeat(13,var(--t))}
#tiles div{width:var(--t);height:var(--t);cursor:pointer}
.tg{background:var(--g1)}.tg.alt{background:var(--g2)}
.tp{background:var(--path);box-shadow:inset 0 0 0 1px var(--path-e)}
.ts{background:var(--sand);background-image:radial-gradient(circle at 30% 40%,var(--path-e) 1.2px,transparent 1.6px),radial-gradient(circle at 70% 75%,var(--path-e) 1px,transparent 1.4px)}
.tw{background:var(--water);background-image:radial-gradient(ellipse 40% 12% at 30% 35%,var(--water-d) 60%,transparent 62%),radial-gradient(ellipse 40% 12% at 72% 72%,var(--water-d) 60%,transparent 62%)}
.ob{position:absolute;left:calc(var(--t) * var(--x));top:calc(var(--t) * var(--y));width:var(--t);height:var(--t);display:grid;place-items:center;pointer-events:none}
.tree::before{content:"";position:absolute;width:86%;height:70%;top:4%;left:7%;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#8FCB6A,#4E9A45 70%);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tree::after{content:"";position:absolute;width:18%;height:30%;bottom:4%;left:41%;background:#8A5E34;border-radius:3px}
.tree i{position:absolute;width:16%;height:16%;border-radius:50% 50% 45% 45%;background:#9A6232;box-shadow:0 -2px 0 #6E4524 inset;z-index:1}
.tree.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.bld{width:calc(var(--t) * 2);height:calc(var(--t) * 2)}
.bld .roof{position:absolute;left:4%;right:4%;top:2%;height:46%;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--rf)}
.bld .wall{position:absolute;left:12%;right:12%;top:46%;bottom:6%;background:#FBF3E2;border:2px solid #8A5E34;border-radius:3px}
.bld .door{position:absolute;left:18%;width:22%;bottom:6%;height:30%;background:#8A5E34;border-radius:5px 5px 0 0}
.bld .win{position:absolute;right:20%;top:56%;width:24%;height:18%;background:#BFE3F2;border:2px solid #8A5E34;border-radius:3px}
.bld .sign{position:absolute;left:50%;top:30%;z-index:2;transform:translateX(-50%);font-family:var(--display);font-size:max(9px,calc(var(--t) * .28));line-height:1.2;white-space:nowrap;background:#FFF6E0;color:#3B2F24;border:1.5px solid #8A5E34;border-radius:6px;padding:0 4px}
.bld.genba .roof,.bld.genba .wall,.bld.genba .door,.bld.genba .win{display:none}
.bld.genba .yard{position:absolute;inset:8% 6% 6%;border-radius:6px;background:repeating-linear-gradient(-45deg,#F2B705 0 6px,#3B2F24 6px 12px);padding:4px}
.bld.genba .yard::after{content:"";position:absolute;inset:4px;border-radius:4px;background:#D9B98A}
.bld.genba .crane{position:absolute;z-index:1;font-size:calc(var(--t) * .85);left:10%;top:34%}
.bld.genba .sign{top:2%}
.bld.genba .cone{position:absolute;z-index:1;font-size:calc(var(--t) * .5);right:12%;bottom:12%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bld .win{background:#F7D774;box-shadow:0 0 8px #F7D774}}
:root[data-theme="dark"] .bld .win{background:#F7D774;box-shadow:0 0 8px #F7D774}
.npc,.me{z-index:3}
.npc svg,.me svg{width:92%;height:92%;filter:drop-shadow(0 2px 0 var(--shade))}
.npc .mark{position:absolute;top:-34%;left:50%;transform:translateX(-50%);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:13px;line-height:20px;text-align:center;box-shadow:0 2px 0 var(--wood-d);animation:bob 1.4s ease-in-out infinite}
.npc .mark.daily{background:var(--berry);color:#fff}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-3px)}}
.me{transition:left .14s linear,top .14s linear}
.me.flip svg{transform:scaleX(-1)}
.flw{font-size:calc(var(--t) * .62);z-index:2}
.shiori{z-index:2;font-size:calc(var(--t) * .62);animation:bob2 1.6s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pop{position:absolute;z-index:6;font-weight:900;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 8px;font-size:13px;white-space:nowrap;pointer-events:none;animation:popup 1s ease forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.tip{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-size:.85rem;line-height:1.55;min-height:3.4em;display:flex;align-items:center;gap:8px}
.tip .tf{width:30px;height:30px;flex:none}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.dpad button{border:none;border-radius:12px;background:var(--wood);color:var(--wood-ink);box-shadow:0 3px 0 var(--wood-d);cursor:pointer;display:grid;place-items:center}
.dpad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.dpad svg{width:22px;height:22px}
.ctrl-r{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.abtn{width:92px;height:92px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1rem;box-shadow:0 4px 0 var(--wood-d);cursor:pointer}
.abtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood-d)}
.mini{font-size:.8rem;color:var(--sub);text-align:center}
/* panels */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.board{background:var(--wood);color:var(--wood-ink);border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--wood-d);display:flex;flex-direction:column;gap:8px}
.board .muted{color:var(--wood-ink);opacity:.85}
.stamps{display:flex;gap:6px}
.stamps span{width:28px;height:28px;border-radius:50%;border:2px dashed var(--wood-ink);display:grid;place-items:center;font-size:15px}
.stamps span.on{border-style:solid;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{border:none;border-radius:14px;padding:10px 18px;font-weight:900;font-size:1rem;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--wood-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.green{background:var(--leaf);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qgroup{display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .f{width:44px;height:44px;flex:none}
.qhead .f svg{width:44px;height:44px}
.qitem{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
.qitem .no{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.85rem;background:var(--line);color:var(--ink)}
.qitem.open{border-color:var(--accent)}
.qitem.open .no{background:var(--accent);color:var(--accent-ink)}
.qitem.done .no{background:var(--leaf);color:var(--paper)}
.qitem.lock{cursor:default;opacity:.6}
.qitem .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.qitem .tx small{color:var(--sub)}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap;font-size:.95rem}
.stars .off{color:var(--line)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,16,10,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -4px 0 var(--wood);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease}
.sheet .inner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .inner>:first-child{margin-right:46px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:1.2rem;cursor:pointer;line-height:1}
.talk{display:flex;gap:10px;align-items:flex-start}
.talk .f{width:52px;height:52px;flex:none}
.talk .f svg{width:52px;height:52px}
.talk .bub{flex:1;min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 12px}
.talk .bub b.who{display:block;font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--sub)}
.qtext{font-family:var(--display);font-size:1.15rem;line-height:1.6;text-wrap:pretty}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.ok{background:var(--leaf)}.prog i.ng{background:var(--berry)}.prog i.cur{background:var(--accent)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choices button{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 8px;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums;line-height:1.35}
.choices button:hover{border-color:var(--accent)}
.choices button.right{background:var(--leaf-soft);border-color:var(--leaf);box-shadow:0 3px 0 var(--leaf)}
.choices button.wrong{background:var(--berry-soft);border-color:var(--berry);box-shadow:0 3px 0 var(--berry)}
.choices button:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--leaf-soft)}.fb.ng{background:var(--berry-soft)}
.fb .head{font-family:var(--display);font-size:1.25rem}
.check{border-left:5px solid var(--berry);background:var(--paper);border-radius:0 12px 12px 0;padding:8px 12px}
.check b{color:var(--berry);font-size:.8rem;letter-spacing:.06em;display:block}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;background:var(--paper);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.steps li::before{content:"手順" counter(s);align-self:flex-start;font-size:.72rem;font-weight:900;background:var(--wood);color:var(--wood-ink);border-radius:8px;padding:1px 8px}
.keys{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.key{min-width:32px;text-align:center;padding:1px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);border-bottom-width:3px;font-weight:900;font-variant-numeric:tabular-nums}
.key.op{color:var(--wood-d)}
.ans{font-weight:900;color:var(--leaf)}
.point{border-left:5px solid var(--sky);background:var(--sky-soft);border-radius:0 12px 12px 0;padding:8px 12px;font-size:.92rem}
.point b{color:var(--sky);font-size:.78rem;letter-spacing:.06em;display:block}
.hintbox{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:.95rem}
.calc{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.calc .disp{background:var(--bg);border-radius:10px;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums}
.calc .disp .e{color:var(--sub);font-size:.8rem;min-height:1.3em;word-break:break-all}
.calc .disp .r{font-size:1.5rem;font-weight:900}
.calc .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .g button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 0;font-weight:900;font-size:1.05rem;cursor:pointer}
.calc .g button.op{color:var(--wood-d)}
.calc .g button.eq{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reward{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.reward .big{font-size:3rem;line-height:1;animation:pop .5s ease}
.reward .stars{font-size:1.8rem}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.gets{display:flex;flex-direction:column;gap:8px;width:100%}
.get{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left}
.get .e{font-size:1.8rem;width:40px;text-align:center}
.get svg{width:34px;height:34px}
/* room */
.room{--wallc:#F6E7C8;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--wood),0 4px 0 4px var(--wood-d);background:#C9A06E}
.room .wallband{height:56px;background:var(--wallc);border-bottom:6px solid #A97C4D;position:relative}
.room .wallband .window{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:84px;height:38px;background:linear-gradient(#BFE3F2,#E7F5FB);border:3px solid #A97C4D;border-radius:6px}
.room .wallband .window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#A97C4D}
.floor{display:grid;grid-template-columns:repeat(6,1fr);aspect-ratio:6/6;max-width:100%}
.floor.wood{background:repeating-linear-gradient(90deg,#D7A86E 0 calc(100%/6 - 2px),#C08E57 calc(100%/6 - 2px) calc(100%/6))}
.floor.tatami{background:#CFD98F;background-image:linear-gradient(90deg,transparent 49%,#8F9A4E 49% 51%,transparent 51%),linear-gradient(transparent 49%,#8F9A4E 49% 51%,transparent 51%);background-size:calc(100%/3) calc(100%/3)}
.floor.tile{background:#EDE6DA;background-image:linear-gradient(90deg,#D3C9B8 1px,transparent 1px),linear-gradient(#D3C9B8 1px,transparent 1px);background-size:calc(100%/6) calc(100%/6)}
.floor.rug{background:radial-gradient(ellipse 42% 38% at 50% 52%,#E9A3A0 0 70%,#D9837F 71% 78%,transparent 79%),#D7A86E}
.cell{display:grid;place-items:center;position:relative;cursor:pointer;min-width:0}
.cell .it{font-size:min(34px,8vw);line-height:1;touch-action:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));transition:transform .15s}
.cell.sel .it{transform:scale(1.18)}
.cell.sel::after,.room.placing .cell.empty:hover::after{content:"";position:absolute;inset:3px;border:3px dashed #F2B705;border-radius:10px}
.room.placing .cell.empty::after{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.dragghost{position:fixed;z-index:60;pointer-events:none;font-size:40px;transform:translate(-50%,-60%)}
.inv{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.inv button{flex:none;width:64px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.inv button .e{font-size:1.6rem}
.inv button small{font-size:.68rem;color:var(--sub);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv button.on{border-color:var(--accent);background:var(--accent-soft)}
.inv .cnt{font-size:.7rem;font-weight:900}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{border:2px solid var(--line);border-radius:12px;padding:4px 10px;background:var(--paper);cursor:pointer;font-size:.85rem}
.swatches button.on{border-color:var(--accent);background:var(--accent-soft)}
.swatches i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
/* zukan */
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.zgrid div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.25;min-width:0}
.zgrid .e{font-size:1.9rem;line-height:1.2}
.zgrid small{font-size:.7rem;word-break:keep-all;overflow-wrap:anywhere}
.zgrid div.no .e{color:var(--line);font-family:var(--display)}
.zgrid div.no small{color:var(--sub)}
/* columns */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%;text-align:left}
.citem .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.citem.read .dot{background:var(--leaf)}
.citem.lock{cursor:default;opacity:.62}
.citem.lock .dot{background:var(--line)}
.citem .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.citem .tx small{color:var(--sub)}
.cat{font-size:.72rem;font-weight:900;border-radius:999px;padding:1px 8px;background:var(--bg);color:var(--sub);white-space:nowrap}
.reader{display:flex;flex-direction:column;gap:10px;font-size:1rem;line-height:1.85}
.reader .ex{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--wood);box-shadow:0 -3px 0 var(--wood-d);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:none;background:none;color:var(--wood-ink);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px;cursor:pointer;font-size:.72rem;font-weight:700;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{background:var(--wood-d)}
.tabs .badge{position:absolute;top:0;right:18%;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:.65rem;line-height:16px;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);text-align:center;box-shadow:0 3px 0 var(--shade)}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%}
.avs{display:flex;gap:10px}
.avs button{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.8rem}
.avs button svg{width:56px;height:56px}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.shoplist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sitem{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sitem .e{font-size:2rem;line-height:1.1}
.sitem .pr{display:flex;align-items:center;gap:3px;font-weight:900;font-variant-numeric:tabular-nums}
.sitem .pr svg{width:18px;height:18px}
.sitem .btn{padding:6px 14px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}.abtn{width:80px;height:80px}}
@media (max-height:720px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.abtn{width:76px;height:76px}.tip{min-height:0}}
</style>
</head>

        <button type="button" data-d="-1,0" aria-label="ひだり"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 12l10-7v14z"/></svg></button><span></span><button type="button" data-d="1,0" aria-label="みぎ"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 12L8 19V5z"/></svg></button>

<script>
/* ---------- コラム（50本） ---------- */
var COLS=[
/* クエストでよめる（30） */
{id:'c01',c:'keisan',t:'%は「100こに分けた何こ分」',b:'<p>パーセント（%）は「ぜんぶを100こに分けたうちの、何こ分か」をあらわすことば。</p><p>30%なら、100こに分けたうちの30こ分。ぜんぶが2,000円でも2億円でも、考え方は同じ。</p><div class="ex">2,000円の1% ＝ 20円（100こに分けた1こ分）<br>30% ＝ 20円 × 30 ＝ 600円</div><p>まよったら「まず1%分を出して、それを何こ集めるか」と考えると、まちがえにくいよ。</p>'},
{id:'c02',c:'keisan',t:'わり算は「1つ分」を出す計算',b:'<p>わり算には2つの使い方がある。「同じ数ずつ分ける」と「いくつ分あるか数える」。</p><p>%で使うのは、ぶぶん ÷ ぜんぶ ＝「ぜんぶを1としたら、ぶぶんはいくつ分？」という使い方。</p><div class="ex">300 ÷ 1,200 ＝ 0.25<br>→ ぜんぶを1とすると、0.25こ分</div><p>この0.25に100をかけると25%。「1の目もり」を「100の目もり」に直すのが×100の役目だよ。</p>'},
{id:'c03',c:'keisan',t:'×100はなぜするの？',b:'<p>ぶぶん ÷ ぜんぶ で出てくる0.25のような数は、「ぜんぶを1」としたときの大きさ。</p><p>でも%は「ぜんぶを100」としたときの大きさ。だから100倍して目もりをそろえる。</p><div class="ex">0.25 × 100 ＝ 25%<br>0.07 × 100 ＝ 7%<br>1.2 × 100 ＝ 120%</div><p>×100を忘れると、0.25%のような小さすぎる答えになる。答えを見て「小さすぎない？」と思ったら、×100をたしかめよう。</p>'},
{id:'c04',c:'keisan',t:'割・分・厘のよみかた',b:'<p>「割（わり）」は10%のこと。1割＝10%、3割＝30%。</p><p>「分（ぶ）」は1%、「厘（りん）」は0.1%。野球の打率「3割2分5厘」は32.5%のことだよ。</p><div class="ex">2割5分 ＝ 25%<br>1割引き ＝ 10%引き<br>4割の前払金 ＝ 40%</div><p>注意したいのは「5分（ごぶ）」。時間の5分ではなく5%のこと。値引きの話でよく出てくるよ。</p>'},
{id:'c05',c:'keisan',t:'○%引きは「100−○」%を払う',b:'<p>「20%引き」と言われたら、払うのはのこりの80%。</p><p>値引きの金額を出してから引いてもいいけど、「100−20＝80%」と言いかえると、電卓1回で答えが出る。</p><div class="ex">3,000万円の5%引き<br>→ 3000 × 95 ÷ 100 ＝ 2,850万円</div><p>反対に「○%ふえる」は「100＋○」%にする。税込み（10%足す）が110%なのも同じ考え方だよ。</p>'},
{id:'c06',c:'keisan',t:'電卓は「%キー」より×÷100',b:'<p>電卓の%キーは、機種によって動き方がちがうことがある。</p><p>まちがいを防ぐなら、%キーは使わずに「× ○ ÷ 100」と打つのがいちばん安心。</p><div class="ex">2,400の15% → 2400 × 15 ÷ 100 ＝ 360<br>2,400は1,600の何%？ → 2400 ÷ 1600 × 100 ＝ 150</div><p>ふつうの電卓は打った順に計算するので、この順番でそのまま打てばOK。</p>'},
{id:'c07',c:'genba',t:'進捗率と出来高（できだか）',b:'<p>進捗率は「工事がどこまで進んだか」を%であらわしたもの。出来高は、できあがった分を金額であらわしたもの。</p><div class="ex">請負金額 1億円、進捗率 40%<br>→ 出来高 ＝ 10000 × 40 ÷ 100 ＝ 4,000万円</div><p>役所への部分払いの請求や、下請けさんへの支払いは、この出来高をもとに計算することが多いよ。</p>'},
{id:'c08',c:'genba',t:'人工（にんく）ってなに？',b:'<p>1人が1日はたらく量が「1人工（にんく）」。5人で4日なら、5×4＝20人工。</p><p>作業員さんの手間を数える単位で、見積や日報でよく使う。</p><div class="ex">20人工 × 1人工2万5,000円 ＝ 50万円</div><p>「人工がかかる」「10人工の作業」のように使うよ。</p>'},
{id:'c09',c:'genba',t:'立米（りゅうべ）と平米（へいべい）',b:'<p>現場では、体積の㎥を「立米（りゅうべ）」、面積の㎡を「平米（へいべい）」と言うことが多い。</p><div class="ex">たて2m × よこ3m ＝ 6平米（6㎡）<br>6平米 × 深さ0.5m ＝ 3立米（3㎥）</div><p>生コン・砕石・残土は「立米」、舗装・型枠・足場は「平米」で数えることが多いよ。</p>'},
{id:'c10',c:'genba',t:'工期と工程表',b:'<p>工期は、工事を始めてから終わらせるまでの期間。契約書に「いつからいつまで」と書かれている。</p><p>工程表は、どの作業をいつやるかを並べた予定表。横に日付、たてに作業がならぶ「バーチャート」がよく使われる。</p><p>工期の何%がすぎたかと進捗率をくらべると、予定より進んでいるか、遅れているかがわかるよ。</p>'},
{id:'c11',c:'keisan',t:'「ポイント」と「%」のちがい',b:'<p>%どうしの差は「ポイント」で言う。予定60%、実際55%なら「5ポイント遅れ」。</p><p>これを「5%遅れ」と言うと、「60の5%（3）遅れ」とまちがえられることがある。</p><div class="ex">落札率 92% → 95%：3ポイント上がった</div><p>報告や書類で%どうしをくらべるときは、「ポイント」と言うのがおすすめ。</p>'},
{id:'c12',c:'genba',t:'台数や人数は「切り上げ」',b:'<p>残土が100立米、ダンプ1台で6立米運べるなら、100÷6＝16.66…台。</p><p>16台だと、4立米が運べずに残ってしまう。だから17台。台数・人数・回数のように「足りないと困る数」は切り上げる。</p><p>反対に、お金の端数は切り捨てることが多い。何を数えているかで決まるよ。</p>'},
{id:'c13',c:'soumu',t:'相見積もり（あいみつもり）',b:'<p>同じ工事の見積りを何社かにお願いしてくらべることを「相見積もり（あいみつ）」という。</p><p>くらべるときは、金額だけでなく「何がふくまれているか」をそろえるのが大事。</p><p>ほかの会社の見積書をそのまま見せるのはマナー違反とされることが多いので、交渉では「予算はこのくらいです」と伝えるのが一般的だよ。</p>'},
{id:'c14',c:'soumu',t:'別途（べっと）と一式（いっしき）',b:'<p>見積書の「別途」は「この金額には入っていません」という意味。足場別途、運搬別途などと書かれる。</p><p>「一式」は、細かく数えずにまとめた金額。「仮設工 一式 120万円」のように使う。</p><p>安く見える見積りでも、別途の分を足すと高くなることがある。くらべるのは別途を足してから。</p>'},
{id:'c15',c:'soumu',t:'出精値引き（しゅっせいねびき）',b:'<p>見積書の最後に「出精値引き」と書いて、端数を切ってきりのいい金額にすることがある。</p><div class="ex">合計 2,347万8,000円<br>出精値引き −47万8,000円<br>見積金額 2,300万円</div><p>「せいいっぱい努力して値引きしました」という意味のことば。値引き額や値引き率を計算する場面でよく出てくるよ。</p>'},
{id:'c16',c:'keisan',t:'「〜より何%」は「〜」で割る',b:'<p>「BはAより何%安い？」と聞かれたら、もとになるのはA。差をAで割る。</p><div class="ex">A 2,500万円、B 2,250万円<br>差 250 ÷ A 2,500 × 100 ＝ 10%安い</div><p>同じ2社でも「AはBより何%高い？」なら、もとはB。250 ÷ 2,250 × 100 ＝ 約11.1%。もとがちがうと答えも変わるよ。</p>'},
{id:'c17',c:'soumu',t:'注文書と請書（うけしょ）',b:'<p>下請けさんに工事をお願いするときは、注文書（または契約書）を出して、下請けさんから「お請けします」という請書をもらう。</p><p>建設業法では、工事の内容・代金・工期などを書面にして交わすことが決められている。</p><p>金額は税抜きか税込みか、支払い条件はどうか。総務の目でも確認しておくと安心だよ。</p>'},
{id:'c18',c:'soumu',t:'下請けさんへの支払いは早めに',b:'<p>建設業法では、元請が発注者から出来高や完成の支払いを受けたら、下請けさんには1か月以内、できるだけ短い期間で支払うことになっている。</p><p>支払いの予定表は総務がつくることが多い。「いつ・どこに・いくら」を一覧にしておくと、もれが防げるよ。</p>'},
{id:'c19',c:'okane',t:'税込みは×1.1、税抜きは÷1.1',b:'<p>消費税10%のとき、税込みは税抜きの110%。だから税抜き × 110 ÷ 100 で税込み。</p><p>反対に、税込みから税抜きにもどすときは ÷ 110 × 100。</p><div class="ex">税込み 1,100万円 ÷ 110 × 100 ＝ 1,000万円（税抜き）<br>1,100万円から10%を引くと990万円になってしまう</div><p>税込みから10%を引くのは、まちがえやすいポイントだよ。</p>'},
{id:'c20',c:'okane',t:'億と万を行き来する',b:'<p>1億は1万の1万倍。だから 1億 ＝ 10,000万。</p><div class="ex">1億2,000万円 ＝ 12,000万円<br>1億800万円 ＝ 10,800万円（1,800万ではない）<br>2億50万円 ＝ 20,050万円</div><p>電卓には「万」の数字で入れて、答えも「万円」で読むと、0の数をまちがえにくいよ。</p>'},
{id:'c21',c:'okane',t:'粗利（あらり）と実行予算',b:'<p>実行予算は、工事を実際にやるのにかかるお金の社内の見込み。請負金額との差が粗利（あらり）、つまり会社のもうけになる。</p><div class="ex">請負金額 1億円、実行予算 9,200万円<br>粗利 800万円 → 粗利率 8%</div><p>材料の値上がりや工期のびでお金がふえると、その分はまず粗利からへっていくよ。</p>'},
{id:'c22',c:'okane',t:'前払金（まえばらいきん）',b:'<p>公共工事では、工事を始めるためのお金を、契約金額の一部まで先にもらえる「前払金」のしくみがある。</p><p>請求するときは、保証会社の保証をつける。何割まで出るかは発注者や工事の金額で決まっていて、4割のことが多い。</p><p>前払金は、材料費や機械の費用など、その工事のために使うきまりになっているよ。</p>'},
{id:'c23',c:'keisan',t:'切り捨て・切り上げ・四捨五入',b:'<p>切り捨ては「下の位をすてる」、切り上げは「少しでもあれば1つ上げる」、四捨五入は「5以上なら上げる」。</p><div class="ex">12,345,678円（千円未満）<br>切り捨て 12,345,000円<br>切り上げ 12,346,000円<br>四捨五入 12,346,000円</div><p>どれを使うかは、書類や会社のきまりで決まっている。迷ったら「端数はどうしますか？」と聞けばOK。</p>'},
{id:'c24',c:'soumu',t:'インボイス（適格請求書）',b:'<p>2023年10月から、消費税の計算のために「適格請求書（インボイス）」という形式の請求書が使われている。</p><p>登録番号（Tではじまる13けたの番号）や、税率ごとの金額・消費税額が書かれているのが特徴。</p><p>下請けさんから届いた請求書に登録番号があるかを確認するのも、総務のだいじな仕事のひとつだよ。</p>'},
{id:'c25',c:'okane',t:'予定価格と落札率',b:'<p>予定価格は、発注者（市・県・国）が「この工事はここまで払う」と決めた上限の金額。これを超えると落札できない。</p><div class="ex">予定価格 1億5,000万円、落札 1億3,800万円<br>→ 13800 ÷ 15000 × 100 ＝ 92%</div><p>入札の金額はふつう税抜き。契約書には消費税を足した金額を書くよ。</p>'},
{id:'c26',c:'okane',t:'最低制限価格',b:'<p>安すぎる金額で受けると、工事の品質が落ちたり、働く人にしわよせが来たりするおそれがある。</p><p>そのため、これより安いと失格になる「最低制限価格」や、安すぎる入札を調べる「低入札価格調査」のしくみがある。</p><p>計算のしかたや、前もって公表するかどうかは、発注者ごとにちがうよ。</p>'},
{id:'c27',c:'okane',t:'特定建設業と一般建設業',b:'<p>元請として受けた工事で、下請けに出す金額の合計が5,000万円以上（建築一式工事は8,000万円以上）になるときは、「特定建設業」の許可がいる。</p><p>この金額は2025年2月に引き上げられた。1社ごとではなく、合計で判断するのがポイント。</p><p>許可の種類によって、置く技術者（監理技術者など）も変わってくるよ。</p>'},
{id:'c28',c:'okane',t:'変更契約',b:'<p>工事の途中で、地盤が思ったよりやわらかかった、地元の要望で範囲が広がった、などの理由で工事の内容が変わることがある。</p><p>そのときは発注者と話し合って「変更契約」を結び、金額や工期を変える。</p><p>「何%ふえたか」は、変える前（当初）の契約金額をもとに計算するよ。</p>'},
{id:'c29',c:'soumu',t:'コリンズ（CORINS）登録',b:'<p>公共工事を受注すると、工事の内容を「コリンズ（工事実績情報システム）」に登録することが多い。</p><p>国の工事などでは、請負金額500万円以上の工事について、契約後に土日・祝日をのぞく10日以内に登録するのが目安。発注者によってきまりがちがうので確認しよう。</p><p>登録した実績は、次の入札で会社の実績として見られるよ。</p>'},
{id:'c30',c:'soumu',t:'施工体制台帳',b:'<p>どの会社が、どの工事を、どんな体制でやっているかをまとめた書類が「施工体制台帳」。</p><p>公共工事では、下請契約を結ぶときは金額にかかわらず作成して、写しを発注者に出すことになっている。</p><p>下請けさんの許可や技術者、保険の加入状況なども書くので、総務が書類を集めることが多いよ。</p>'},
/* しおりでよめる（20） */
{id:'s01',c:'soumu',t:'元請・一次下請・二次下請',b:'<p>発注者（市・県・国など）から直接工事を受ける会社が「元請」。元請から仕事を受けるのが「一次下請」、その一次から受けるのが「二次下請」。</p><p>市や県から直接受注している会社は、書類の上では「元請」になる。現場では元請のことを「一次」と呼ぶ人もいるので、話のときは確認すると安心だよ。</p>'},
{id:'s02',c:'genba',t:'JV（共同企業体）',b:'<p>大きな工事では、いくつかの会社がチームを組んで受注することがある。これを「JV（ジョイントベンチャー）」「共同企業体」という。</p><p>出資の割合（たとえば60%と40%）に合わせて、仕事やお金を分けることが多い。ここでも%の計算が出てくるよ。</p>'},
{id:'s03',c:'genba',t:'監理技術者と主任技術者',b:'<p>工事現場には、技術の責任者として「主任技術者」を置く。下請けに出す金額が大きい元請（特定建設業）は「監理技術者」を置く。</p><p>公共工事などで請負金額が4,500万円以上（建築一式は9,000万円以上）だと、その現場だけを担当する「専任」が必要になる（2025年2月からの金額）。</p>'},
{id:'s04',c:'genba',t:'朝礼とKY活動',b:'<p>現場の1日は朝礼から始まることが多い。その日の作業や注意点をみんなで確認する。</p><p>KY活動は「危険（K）予知（Y）」のこと。「この作業ではどんな危ないことが起きそうか」を話し合って、対策を決める。</p><p>ヒヤッとした、ハッとしたできごとを集める「ヒヤリハット」も、事故を防ぐ大切な取り組みだよ。</p>'},
{id:'s05',c:'soumu',t:'安全書類（グリーンファイル）',b:'<p>下請けさんが現場に入る前に出してもらう書類をまとめて「安全書類」や「グリーンファイル」と呼ぶ。</p><p>作業員名簿、資格の写し、持ちこむ機械の届けなどがふくまれる。</p><p>集めて、もれがないか確認して、現場に回すのは、総務や工事事務の仕事になることが多いよ。</p>'},
{id:'s06',c:'soumu',t:'建設キャリアアップシステム',b:'<p>作業員さん一人ひとりの資格や、どの現場で何日働いたかを記録するしくみ。略して「CCUS」。カードを現場で読み取って記録する。</p><p>公共工事では、使うことをすすめられたり、条件になったりする工事がふえているよ。</p>'},
{id:'s07',c:'okane',t:'法定福利費（ほうていふくりひ）',b:'<p>健康保険や厚生年金など、法律で会社が負担することになっている保険料のこと。</p><p>建設業では、見積書の中で法定福利費を分けて書く（内訳を明示する）ことがすすめられている。</p><p>作業員さんの社会保険をきちんと払うための、大事なお金だよ。</p>'},
{id:'s08',c:'okane',t:'労務費の新しいルール',b:'<p>2025年12月から、作業員さんの賃金のもとになる労務費を、著しく低くした見積りや契約が禁止された。</p><p>注文する側だけでなく、受ける側（下請け）が安すぎる見積りを出すことも禁止になったのがポイント。</p><p>「安いほどいい」ではなく、適正な金額かどうかを見ることが大切になっているよ。</p>'},
{id:'s09',c:'okane',t:'スライド条項',b:'<p>工事の途中で材料の値段や賃金が大きく上がったとき、契約金額を変えるよう発注者に求められるしくみがある。これを「スライド条項」という。</p><p>公共工事の契約書（約款）に書かれていて、値上がりの幅などの条件がある。値上がりを数字で正確につかんでおくのが第一歩だよ。</p>'},
{id:'s10',c:'genba',t:'出来形（できがた）',b:'<p>出来形は、できあがったものの形や寸法のこと。図面どおりの長さ・高さ・厚さになっているかを測って記録する。</p><p>「出来高」は金額、「出来形」は形や寸法。一字ちがいなので、まちがえないようにね。</p>'},
{id:'s11',c:'genba',t:'完成検査と工事成績',b:'<p>工事が終わると、発注者の検査を受ける。書類と現場の両方を確認される。</p><p>公共工事では、出来ばえや書類の整い方などが点数で評価される（工事成績評定）。この点数は、次の入札で会社の評価に使われることもあるよ。</p>'},
{id:'s12',c:'okane',t:'単価 × 数量 ＝ 金額',b:'<p>見積書の内訳は「単価 × 数量 ＝ 金額」の行がならんでできている。</p><div class="ex">U字溝 1本 6,800円 × 2,200本 ＝ 14,960,000円（1,496万円）</div><p>合計がおかしいと思ったら、まず1行ずつ「単価×数量」が合っているか電卓でたしかめよう。</p>'},
{id:'s13',c:'keisan',t:'暗算のコツ：10%と1%',b:'<p>10%は「0を1つ消す」、1%は「0を2つ消す」。</p><div class="ex">4,800万円の10% → 480万円<br>4,800万円の1% → 48万円<br>15% ＝ 10%＋5%（10%の半分）→ 480＋240 ＝ 720万円</div><p>電卓を打つ前に、だいたいの答えを暗算しておくと、打ちまちがいにすぐ気づけるよ。</p>'},
{id:'s14',c:'keisan',t:'%の%',b:'<p>「80%の50%」は、80 × 50 ÷ 100 ＝ 40%。%に%をかけるときも、「○%はいくつ」と同じ計算。</p><div class="ex">出来高80%のうち、下請けさんの分が50%<br>→ ぜんたいの40%</div><p>%どうしを足したり引いたりするときは、もとが同じかどうかに注意しよう。</p>'},
{id:'s15',c:'keisan',t:'平均のワナ',b:'<p>平均は「ぜんぶ足して、数で割る」。でも1つだけとても安い・高い数字があると、平均は引っぱられる。</p><div class="ex">2,500万・2,600万・1,200万 の平均 → 2,100万円</div><p>見積の平均とくらべるときは、極端な見積りがないかも見よう。安すぎる見積りは、別途の項目がぬけていることもあるよ。</p>'},
{id:'s16',c:'keisan',t:'検算（けんざん）のすすめ',b:'<p>答えが出たら、逆の計算でたしかめる。これを検算という。</p><div class="ex">2,500の10%引き → 2,250<br>たしかめ：2250 ÷ 2500 × 100 ＝ 90% ✓</div><p>書類の数字は、だれかがあとで使う。1回たしかめるだけで、大きなミスを防げるよ。</p>'},
{id:'s17',c:'genba',t:'生コンと打設（だせつ）',b:'<p>工場でつくって、ミキサー車で運ばれてくるコンクリートを「生コン」という。型枠に流しこむ作業を「打設（だせつ）」と言う。</p><p>生コンは時間がたつと固まり始めるので、打設の日は段取りがとても大事。こぼれや余りの分（ロス）を少し多めに見こんで注文するよ。</p>'},
{id:'s18',c:'genba',t:'バックホウと重機の呼び方',b:'<p>ショベルで土を掘る重機を「バックホウ」と言う。「ユンボ」と呼ぶ人も多い。</p><p>大きさはバケット（ショベル部分）の容量で「0.45立米クラス」のように呼ぶ。</p><p>重機をトラックで現場に運ぶことを「回送」と言い、見積書では回送費として出てくるよ。</p>'},
{id:'s19',c:'soumu',t:'工事の書類はだれのため？',b:'<p>工事の書類は、発注者に出すためだけのものではない。何年かたってから修理や点検をするときにも見返される。</p><p>日付・金額・数量がきちんとそろっていることが、会社の信用にもつながる。総務の「たしかめる力」が役に立つところだよ。</p>'},
{id:'s20',c:'okane',t:'部分払い（出来高払い）',b:'<p>工期が長い工事では、完成を待たずに、できた分（出来高）に応じてお金を受け取れる「部分払い」がある。</p><p>部分払いの金額は、出来高から前払金の分などを差し引いて計算するのがふつう。計算のしかたは契約書（約款）で決まっているので、書式どおりに計算しよう。</p>'}
];
var COLCAT=[['all','ぜんぶ'],['keisan','計算のコツ'],['genba','現場のことば'],['soumu','総務のしごと'],['okane','お金と契約']];

/* ---------- 数字の見せ方 ---------- */
function R(a){return a[Math.floor(Math.random()*a.length)]}
function cm(n){n=Math.round(n*1000)/1000;return n.toLocaleString('ja-JP',{maximumFractionDigits:3})}
function man(n){n=Math.round(n*100)/100;if(n>=10000){var o=Math.floor(n/10000),r=Math.round((n-o*10000)*100)/100;return o+'億'+(r?cm(r)+'万':'')+'円'}return cm(n)+'万円'}
function r1(x){return Math.round(x*10)/10}
function isI(x){return Math.abs(x-Math.round(x))<1e-9}
function kn(n){return String(Math.round(n*10000)/10000)}
function dec(x){return (Math.round(x*10000)/10000).toLocaleString('ja-JP',{maximumFractionDigits:4})}
function dv(v,u){
  if(typeof v==='string')return v;
  var ap=isI(v*100)?'':'約',vv=ap?r1(v):v;
  if(u==='万円')return ap+man(vv);
  if(u==='円')return ap+cm(vv)+'円';
  return ap+cm(vv)+u;
}
/* ---------- 問題をつくる ---------- */
var FILL={
  '%':[[10,'けた（0の数）がずれているみたい。'],[0.1,'けたがずれているみたい。×100を2回していないかな？'],[1.5,'ちがうみたい。下の「とき方」を見てみよう。'],[0.5,'ちがうみたい。下の「とき方」を見てみよう。']],
  'ポイント':[[2,'ちがうみたい。予定の%を出してから、出来高との差を出すよ。'],[0.5,'ちがうみたい。下の「とき方」を見てみよう。']],
  '台':[[1,'+1'],[-1,'-1']],
  def:[[10,'0が1つ多いみたい。けたをたしかめよう。'],[0.1,'0が1つ足りないみたい。けたをたしかめよう。'],[1.2,'ちがうみたい。下の「とき方」を見てみよう。'],[0.8,'ちがうみたい。下の「とき方」を見てみよう。']]
};
function build(p){
  var ch=[];
  function add(v,m,ok){
    if(!p.opts&&(typeof v!=='number'||!isFinite(v)||v<=0))return;
    var lab=dv(v,p.unit);
    for(var i=0;i<ch.length;i++)if(ch[i].lab===lab)return;
    ch.push({lab:lab,v:v,ok:!!ok,m:m||''});
  }
  add(p.ans,'',true);
  (p.traps||[]).forEach(function(t){add(t[0],t[1])});
  if(!p.opts){
    var f=FILL[p.unit]||FILL.def;
    if(p.unit==='台'){add(p.ans+1,'1台多いみたい。わり算の答えを切り上げると、いくつになるかな？');add(p.ans-1,'1台足りないみたい。これだと残土が運びきれないよ。');add(p.ans+2,'ちがうみたい。下の「とき方」を見てみよう。')}
    else for(var i=0;i<f.length&&ch.length<4;i++)add(p.unit==='ポイント'?p.ans*f[i][0]:p.ans*f[i][0],f[i][1]);
    var k=2;while(ch.length<4&&k<9){add(p.ans+k*(p.unit==='%'?1:Math.max(1,Math.round(p.ans/20))),'ちがうみたい。下の「とき方」を見てみよう。');k++}
  }
  ch=ch.slice(0,4);
  for(var j=ch.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=ch[j];ch[j]=ch[r];ch[r]=t}
  if(p.opts)ch.sort(function(a,b){return p.opts.indexOf(a.v)-p.opts.indexOf(b.v)});
  p.choices=ch;p.ansLab=dv(p.ans,p.unit);
  return p;
}

var GEN={
/* ぴょこ：きほん */
pctOf:function(){var X=R([200,400,500,600,800,1000,1200,1500,2000,3000]),Y=R([5,10,15,20,25,30,40,50]),a=X*Y/100,one=X/100;
  return{q:cm(X)+'円の'+Y+'%は、いくら？',unit:'円',ans:a,
  traps:[[X*Y/10,'0が1つ多いみたい。さいごは「÷100」だよ（÷10ではない）。'],[X-a,'それは「のこり」の'+(100-Y)+'%のほう。聞かれているのは'+Y+'%の部分だよ。'],[X/Y,'「÷'+Y+'」で割ってしまったかも。○%は「× ○ ÷ 100」だよ。']],
  steps:[['まず1%分を出す。ぜんぶを100こに分けた1こ分。',kn(X)+' ÷ 100 =',cm(one)+'円'],['1%分を'+Y+'こ集める。',kn(one)+' × '+Y+' =',cm(a)+'円'],['電卓では1回にまとめてもOK。',kn(X)+' × '+Y+' ÷ 100 =',cm(a)+'円']],
  hint:'まず1%分（'+cm(X)+' ÷ 100）を出してみよう。',point:'「○%はいくら？」は、ぜんぶ × ○ ÷ 100。'}},
whatPct:function(){var B=R([200,400,500,800,1000,1200,2000]),pc=R([5,10,20,25,40,50,60,75]),A=B*pc/100;

}

function freeTiles(){var r=[];for(var y=0;y<MH;y++)for(var x=0;x<MW;x++){var t=terr(x,y);if((t==='g'||t==='s')&&!blocked(x,y)&&!isDoorFront(x,y)&&!(x===S.pos.x&&y===S.pos.y))r.push([x,y])}return r}

function objAt(x,y){var b=bldAt(x,y);if(b)return{t:'bld',b:b};var ti=treeAt(x,y);if(ti>=0)return{t:'tree',i:ti};var w=npcAt(x,y);if(w)return{t:'npc',w:w};return null}
function nbrs(x,y){return[[1,0],[-1,0],[0,1],[0,-1]].map(function(d){return{x:x+d[0],y:y+d[1]}}).filter(function(p){return !blocked(p.x,p.y)})}
function bfs(goals){
  var key=function(p){return p.x+','+p.y},gs={};goals.forEach(function(g){gs[key(g)]=1});
  var st={x:S.pos.x,y:S.pos.y};if(gs[key(st)])return[];
  var prev={},q=[st],seen={};seen[key(st)]=1;
  while(q.length){var c=q.shift(),ds=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){var n={x:c.x+ds[i][0],y:c.y+ds[i][1]},k=key(n);if(seen[k]||blocked(n.x,n.y))continue;seen[k]=1;prev[k]=c;
      if(gs[k]){var path=[n],p=c;while(!(p.x===st.x&&p.y===st.y)){path.unshift(p);p=prev[key(p)]}return path}q.push(n)}}
  return null;
}
var walkId=0;
function goTo(goals,done){var path=bfs(goals);if(path===null){tip('そこへは行けないみたい。');return}var id=++walkId;
  (function step(){if(id!==walkId)return;if(!path.length){save();if(done)done();return}
    var n=path.shift();if(n.x<S.pos.x)S.flip=true;else if(n.x>S.pos.x)S.flip=false;S.dir={x:n.x-S.pos.x,y:n.y-S.pos.y};S.pos={x:n.x,y:n.y};updateMe();onStep();setTimeout(step,150)})();
}
function faceTo(x,y){if(x<S.pos.x)S.flip=true;else if(x>S.pos.x)S.flip=false;S.dir={x:Math.sign(x-S.pos.x),y:Math.sign(y-S.pos.y)};updateMe()}
function onStep(){
  for(var i=0;i<S.flowers.length;i++){var f=S.flowers[i];if(f.x===S.pos.x&&f.y===S.pos.y){S.flowers.splice(i,1);addItem(f.id);snd('pick');save();renderObjs();popAt(S.pos.x,S.pos.y,ITEMS[f.id].e+' ゲット');tip(ITEMS[f.id].n+'をつんだ！ おへやにかざれるよ。');break}}
  if(S.shiori&&S.shiori.x===S.pos.x&&S.shiori.y===S.pos.y){var id=S.shiori.id;S.shiori=null;S.cols[id]=1;save();renderObjs();updateBadges();snd('clear');walkId++;openColumn(id,true)}
}
function moveDir(dx,dy){
  walkId++;var nx=S.pos.x+dx,ny=S.pos.y+dy;S.dir={x:dx,y:dy};if(dx)S.flip=dx<0;
  if(!blocked(nx,ny)){S.pos={x:nx,y:ny};updateMe();onStep();save();return}
  updateMe();var o=objAt(nx,ny);if(o)interact(o);

}
function tapTile(x,y){

  return '<div class="calc"><div class="disp"><div class="e" id="ce"></div><div class="r" id="cr">0</div></div><div class="g">'+k.map(function(b){return '<button type="button" class="'+(b[1]||'')+'" data-c="'+b[0]+'">'+b[0]+'</button>'}).join('')+'</div></div>';

function bindCalc(box){
  var cur='',acc=null,op=null,expr='',done=false;
  function ap(a,o,b){var r=o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;return Math.round(r*1e10)/1e10}
  function f(n){return isFinite(n)?String(n):'エラー'}
  function show(){box.querySelector('#cr').textContent=cur||(acc!=null?f(acc):'0');box.querySelector('#ce').textContent=expr}
  box.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){var c=b.dataset.c;
    if(/^\d+$/.test(c)){if(done){acc=null;expr='';done=false}if(cur.length<12)cur=(cur==='0'?'':cur)+c;}
    else if(c==='.'){if(done){acc=null;expr='';done=false}if(cur.indexOf('.')<0)cur=(cur||'0')+'.'}
    else if(c==='C'){cur='';acc=null;op=null;expr='';done=false}
    else if(c==='⌫'){cur=cur.slice(0,-1)}
    else if(c==='='){if(op&&cur!==''){expr+=' '+cur+' =';acc=ap(acc,op,+cur);cur='';op=null;done=true}}
    else{if(cur!==''){if(acc==null||done){acc=+cur;expr=cur}else{acc=ap(acc,op,+cur);expr+=' '+cur}cur=''}else if(acc==null)return;if(done){expr=f(acc);done=false}op=c;expr=expr.replace(/ [÷×−+]$/,'')+' '+c}
    show()})});
}

  $$('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false')});
  if(v==='mura'){sizeMap();defaultTip()}if(v==='quest')renderQuestView();if(v==='heya'){RS={mode:null};renderRoom()}if(v==='zukan')renderZukan();if(v==='col')renderCols();window.scrollTo(0,0)}
function avatarBtns(){return ['usagi','neko','kuma'].map(function(a){return '<button type="button" data-av="'+a+'" aria-pressed="'+(S.avatar===a)+'">'+face(a)+({usagi:'うさぎ',neko:'ねこ',kuma:'くま'}[a])+'</button>'}).join('')}
function bindAvatars(){on('[data-av]',function(el){S.avatar=el.dataset.av;save();Array.prototype.slice.call($('#sheetBody').querySelectorAll('[data-av]')).forEach(function(b){b.setAttribute('aria-pressed',b===el?'true':'false')});renderHud();renderObjs()})}
function openSetup(){
  var h='<h2 id="sheetTitle">ようこそ、ぴょこ村へ</h2>'+talk('piyo','はじめまして！ わたしはぴょこ。この村では、住人のおねがい（クエスト）を計算でかいけつすると、どんぐりや家具がもらえるよ。')+
    '<div class="field"><label for="nmIn">あなたのなまえ</label><input id="nmIn" maxlength="10" value="'+esc(S.name||'ちぐさ')+'" autocomplete="off"></div><div class="field"><span>すがたをえらんでね</span><div class="avs">'+avatarBtns()+'</div></div><div class="row"><button class="btn" type="button" id="startB">はじめる</button></div>';
  openSheet(h,{noClose:true});bindAvatars();
  $('#startB').addEventListener('click',function(){S.name=($('#nmIn').value||'').trim()||'ちぐさ';S.started=true;save();renderHud();closeSheet(true);
    tip('行きたいところをタップすると歩けるよ。「！」マークのぴょこに話しかけると、最初のクエストがもらえる。木をゆらすと、どんぐり！')});
}
function openSettings(){
  var data='';try{data=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}
  var h='<h2 id="sheetTitle">せってい</h2><div class="field"><label for="nmIn">なまえ</label><input id="nmIn" maxlength="10" value="'+esc(S.name)+'" autocomplete="off"></div><div class="field"><span>すがた</span><div class="avs">'+avatarBtns()+'</div></div>'+
    '<div class="row"><button class="btn ghost" type="button" id="sndB">おと：'+(S.sound?'オン':'オフ')+'</button></div>'+
    '<div class="panel"><h3>セーブのバックアップ</h3><p class="muted">データはこの端末のブラウザに保存されているよ。機種変更のときなどは、下の文字をコピーしてメモにとっておいてね。</p><div class="field"><label for="bk">いまのデータ</label><textarea id="bk" rows="3" readonly>'+data+'</textarea></div><div class="row"><button class="btn ghost" type="button" id="cpB">コピー</button></div>'+
    '<div class="field"><label for="rsIn">データをもどす（とっておいた文字をはりつける）</label><textarea id="rsIn" rows="3"></textarea></div><div class="row"><button class="btn ghost" type="button" id="rsB">もどす</button></div></div>'+
    '<div class="panel"><h3>さいしょからあそぶ</h3><p class="muted">どんぐり・家具・クエストの記録がぜんぶ消えるよ。</p><div class="row"><button class="btn ghost" type="button" id="resetB">データをけす</button></div></div>';
  openSheet(h);bindAvatars();
  $('#nmIn').addEventListener('input',function(){S.name=this.value.trim();save();renderHud()});
  $('#sndB').addEventListener('click',function(){S.sound=!S.sound;save();this.textContent='おと：'+(S.sound?'オン':'オフ');snd('pick')});
  $('#cpB').addEventListener('click',function(){var t=$('#bk');try{navigator.clipboard.writeText(t.value).then(function(){toast('コピーしたよ')},function(){t.select();toast('文字をえらんだので、コピーしてね')})}catch(e){t.select();toast('文字をえらんだので、コピーしてね')}});
  $('#rsB').addEventListener('click',function(){try{var j=JSON.parse(decodeURIComponent(escape(atob($('#rsIn').value.trim()))));if(!j||j.v!==1)throw 0;var s=defState();for(var k in j)s[k]=j[k];S=s;save();renderAll();toast('データをもどしたよ');closeSheet()}catch(e){toast('文字が正しくないみたい。コピーしたものをそのまま、はりつけてね。')}});
  var armed=false;$('#resetB').addEventListener('click',function(){if(!armed){armed=true;this.textContent='ほんとうにけす？ もう一度おしてね';var b=this;setTimeout(function(){armed=false;b.textContent='データをけす'},4000);return}
    S=defState();save();closeSheet(true);renderAll();openSetup()});
}
function renderAll(){if(!S.pos||blocked(S.pos.x,S.pos.y))S.pos={x:4,y:5};newDay();renderHud();renderObjs();updateBadges();showView(cur)}

/* ---------- はじめる ---------- */
function init(){
  if(!S.pos||blocked(S.pos.x,S.pos.y))S.pos={x:4,y:5};
  newDay();sizeMap();buildTiles();renderObjs();renderHud();updateBadges();bindRoom();showView('mura');
  $('#map').addEventListener('click',function(e){var r=this.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/T),y=Math.floor((e.clientY-r.top)/T);if(x<0||y<0||x>=MW||y>=MH)return;tapTile(x,y)});
  $$('.dpad button').forEach(function(b){b.addEventListener('click',function(){var d=b.dataset.d.split(',').map(Number);moveDir(d[0],d[1])})});
  $('#btnA').addEventListener('click',function(){var d=S.dir||{x:0,y:1},o=objAt(S.pos.x+d.x,S.pos.y+d.y);if(o){interact(o);return}
    var ds=[[1,0],[-1,0],[0,1],[0,-1]];for(var i=0;i<4;i++){var x=S.pos.x+ds[i][0],y=S.pos.y+ds[i][1],oo=objAt(x,y);if(oo){faceTo(x,y);interact(oo);return}}
    tip('近くにはなにもないみたい。木や住人のとなりで「しらべる」を押してね。')});
  $$('.tabs button').forEach(function(b){b.addEventListener('click',function(){showView(b.dataset.v)})});
  $('#gear').addEventListener('click',openSettings);
  $('#sheetX').addEventListener('click',function(){closeSheet()});
  $('#scrim').addEventListener('click',function(){closeSheet()});
  document.addEventListener('keydown',function(e){if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return}if(cur!=='mura'||/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
    var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();moveDir(m[0],m[1])}else if(e.key===' '||e.key==='Enter'){e.preventDefault();$('#btnA').click()}});
  window.addEventListener('resize',sizeMap);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&newDay()){renderObjs();updateBadges();toast('あたらしい一日がはじまった！ 木にどんぐりが実ったよ。')}});
  if(!S.started)openSetup();
}
init();
})();

</script>
</body>
</html>
